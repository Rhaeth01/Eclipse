name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install
          cd core && npm install && npx tsc && cd ..

      - name: Download Node.js portable (bundled in core/)
        shell: pwsh
        run: |
          $nodeVersion = "22.19.0"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-temp
          Copy-Item -Path "node-temp/node-v$nodeVersion-win-x64/node.exe" -Destination "core/node.exe" -Force
          Remove-Item -Recurse -Force node.zip, node-temp

      - name: Build frontend
        run: npm run build

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: npx tauri build

      - name: Sign and generate latest.json
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exeName = "Eclipse_$($version)_x64-setup.exe"
          $exePath = "src-tauri/target/release/bundle/nsis/$exeName"
          $sigPath = "$exePath.sig"
          $latestJsonPath = "src-tauri/target/release/bundle/nsis/latest.json"
          Write-Host "Version: $version"
          Write-Host "Exe: $exePath"

          # Le .sig minisign a 4 lignes :
          #   1: untrusted comment
          #   2: base64 signature   <-- ce qu'il faut dans le JSON
          #   3: trusted comment
          #   4: base64 trusted sig
          # Tauri updater attend UNIQUEMENT la base64 de la ligne 2 dans le champ
          # `signature` de latest.json. Mettre le fichier complet (avec commentaires)
          # provoque l'erreur "Invalid encoding in minisign data" cote client.
          $sigBase64 = ""
          if (Test-Path $sigPath) {
            $sigLines = Get-Content $sigPath
            if ($sigLines.Count -ge 2) {
              $sigBase64 = $sigLines[1].Trim()
              Write-Host "Signature extraite (ligne 2): $($sigBase64.Substring(0, [Math]::Min(20, $sigBase64.Length)))... (longueur: $($sigBase64.Length))"
            } else {
              Write-Host "ATTENTION: .sig n'a que $($sigLines.Count) ligne(s), format inattendu"
            }
          } else {
            Write-Host "ATTENTION: Pas de fichier .sig, latest.json aura une signature vide (l'auto-update echouera)"
          }

          if ([string]::IsNullOrWhiteSpace($sigBase64)) {
            Write-Host "ERREUR: signature vide — l'auto-updater Tauri refusera l'install. Verifie que TAURI_SIGNING_PRIVATE_KEY est bien defini dans les secrets."
          }

          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $latestJson = @{
            version = $version
            notes = "Eclipse v$version - Setup automatique, 13 commandes, Node.js bundle"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigBase64
                url = "https://github.com/Rhaeth01/Eclipse/releases/download/v$version/$exeName"
              }
            }
          } | ConvertTo-Json -Depth 10
          $latestJson | Out-File -FilePath $latestJsonPath -Encoding utf8
          Write-Host "latest.json genere:"
          Get-Content $latestJsonPath

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          fail_on_unmatched_files: false
