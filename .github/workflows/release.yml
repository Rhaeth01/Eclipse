name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install
          cd core && npm install && npx tsc && cd ..

      - name: Download Node.js portable (bundled in core/)
        shell: pwsh
        run: |
          $nodeVersion = "22.19.0"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-temp
          Copy-Item -Path "node-temp/node-v$nodeVersion-win-x64/node.exe" -Destination "core/node.exe" -Force
          Remove-Item -Recurse -Force node.zip, node-temp

      - name: Build frontend
        run: npm run build

      - name: Generate NSIS branding assets
        run: npm run nsis-assets

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: npx tauri build

      # En Tauri v2, `tauri build` ne signe PLUS automatiquement le bundle — il faut
      # appeler `tauri signer sign` separement avec la cle privee. Si on ne le fait
      # pas, latest.json contient "signature": "" et l'auto-update echoue cote
      # client avec "Invalid encoding in minisign data".
      - name: Sign the bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exeName = "Eclipse_$($version)_x64-setup.exe"
          $exePath = "src-tauri/target/release/bundle/nsis/$exeName"
          $sigPath = "$exePath.sig"
          Write-Host "Signature du bundle $exePath avec TAURI_SIGNING_PRIVATE_KEY..."
          npx tauri signer sign "$exePath"
          if (Test-Path $sigPath) {
            Write-Host "Signature generee: $sigPath"
            Get-Content $sigPath
          } else {
            Write-Host "ERREUR: tauri signer sign n'a pas cree le .sig"
            exit 1
          }

      - name: Sign and generate latest.json
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exeName = "Eclipse_$($version)_x64-setup.exe"
          $exePath = "src-tauri/target/release/bundle/nsis/$exeName"
          $sigPath = "$exePath.sig"
          $latestJsonPath = "src-tauri/target/release/bundle/nsis/latest.json"
          Write-Host "Version: $version"
          Write-Host "Exe: $exePath"

          # Le contenu du fichier .sig produit par `tauri signer sign` EST
          # directement la string base64 a mettre dans le champ `signature` de
          # latest.json. Tauri updater fait :
          #   1. base64-decode le champ `signature` du JSON
          #   2. parse le resultat comme texte minisign (4 lignes)
          # Le .sig est deja cette base64, on n'a rien a decoder ni a extraire.
          $sigContent = ""
          if (Test-Path $sigPath) {
            $sigContent = (Get-Content $sigPath -Raw).Trim()
            Write-Host "Signature (.sig file content, premier 40 chars): $($sigContent.Substring(0, [Math]::Min(40, $sigContent.Length)))... (longueur: $($sigContent.Length))"
            # Sanity check: doit etre du base64 valide
            try {
              $decodedCheck = [Convert]::FromBase64String($sigContent)
              $decodedStr = [System.Text.Encoding]::UTF8.GetString($decodedCheck)
              if ($decodedStr -notmatch "untrusted comment") {
                Write-Host "ATTENTION: le base64 decode ne contient pas 'untrusted comment' — la signature n'est probablement pas au bon format"
              }
            } catch {
              Write-Host "ATTENTION: le contenu du .sig n'est pas du base64 valide — erreur: $_"
            }
          } else {
            Write-Host "ERREUR: Pas de fichier .sig apres signature"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($sigContent)) {
            Write-Host "ERREUR: signature vide — l'auto-updater Tauri refusera l'install"
            exit 1
          }

          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $latestJson = @{
            version = $version
            notes = "Eclipse v$version - Setup automatique, 13 commandes, Node.js bundle"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url = "https://github.com/Rhaeth01/Eclipse/releases/download/v$version/$exeName"
              }
            }
          } | ConvertTo-Json -Depth 10
          $latestJson | Out-File -FilePath $latestJsonPath -Encoding utf8
          Write-Host "latest.json genere:"
          Get-Content $latestJsonPath

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          fail_on_unmatched_files: false
