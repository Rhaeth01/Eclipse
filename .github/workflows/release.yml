name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          cd core && npm install && npx tsc && cd ..

      - name: Download Node.js portable (bundled in core/)
        shell: pwsh
        run: |
          $nodeVersion = "22.19.0"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-temp
          Copy-Item -Path "node-temp/node-v$nodeVersion-win-x64/node.exe" -Destination "core/node.exe" -Force
          Remove-Item -Recurse -Force node.zip, node-temp

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Eclipse v__VERSION__'
          releaseBody: 'See assets below to download the installer.'
          releaseDraft: true
          prerelease: false
          args: ''
